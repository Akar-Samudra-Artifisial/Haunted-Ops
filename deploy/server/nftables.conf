#!/usr/sbin/nft -f
# Firewall of the demo server. install.sh copies this file to /etc/nftables.conf and loads it.
# Only the table "haunted" is replaced on a reload; other tables are not touched.
# Users are named, so the users hops, hlab, prometheus and postgres must exist before the file is loaded.
# Check without loading: nft -c -f /etc/nftables.conf

add table inet haunted
delete table inet haunted

table inet haunted {
  chain input {
    type filter hook input priority filter; policy drop;

    # Drop packets the connection tracker calls invalid.
    ct state invalid drop

    # Replies to connections this host started, and related flows (ICMP errors for them).
    ct state established,related accept

    # Traffic on the loopback interface: Caddy to the API, the API to PostgreSQL, Prometheus and the lab.
    iifname "lo" accept

    # Web: HTTP (needed for the certificate challenge and the redirect to HTTPS) and HTTPS. There is no rule for port 22: access is by SSM only.
    tcp dport { 80, 443 } accept

    # HTTP/3 over QUIC on the same port as HTTPS.
    udp dport 443 accept

    # ICMP errors that path discovery needs (not ping).
    ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

    # ICMPv6 errors and neighbour discovery, which IPv6 needs to work at all.
    ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

    # DHCP replies from the subnet, so the lease is renewed.
    udp sport 67 udp dport 68 accept
    # DHCPv6 replies from the subnet (link-local server address, client port 546), so the IPv6 lease is renewed.
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
  }

  chain output {
    type filter hook output priority filter; policy accept;

    # Instance metadata (IMDS, IPv4): no user but root may read it, so no process of the demo can ask for role credentials.
    meta skuid != 0 ip daddr 169.254.169.254 drop

    # Instance metadata (IMDS, IPv6 address): same rule.
    meta skuid != 0 ip6 daddr fd00:ec2::254 drop

    # The lab, Prometheus and PostgreSQL talk to loopback only: anything else they send is dropped.
    meta skuid { hlab, prometheus, postgres } oifname != "lo" drop

    # The API user (and the hunt child of kiro-cli) may use the loopback interface.
    meta skuid hops oifname "lo" accept

    # The API user may open HTTPS connections (the model service of kiro-cli).
    meta skuid hops tcp dport 443 accept

    # The API user may look up names (UDP and TCP port 53), which an HTTPS connection needs.
    meta skuid hops udp dport 53 accept
    meta skuid hops tcp dport 53 accept

    # Everything else the API user sends is dropped (no other port, no other protocol).
    meta skuid hops drop
  }
}
