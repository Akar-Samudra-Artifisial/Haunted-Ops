# PostgreSQL on the demo server (2 GiB machine shared with the API, Prometheus, Caddy and the lab).
# install.sh copies this file into the conf.d folder of the cluster.
listen_addresses = '127.0.0.1'
max_connections = 30
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB
max_wal_size = 512MB
log_min_duration_statement = 1000
