# Prometheus of the demo server: loopback only, 24 hours of data, small memory. The 5 s scrape interval is in prometheus.yml.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus/ --web.listen-address=127.0.0.1:9090 --storage.tsdb.retention.time=24h
MemoryMax=256M
TasksMax=128
NoNewPrivileges=yes
